[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "turbomole-namd-qmmm"
version = "0.1.0.dev0"
description = "A NAMD custom-QM interface for TURBOMOLE"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Hao Jiang", email = "hao.jiang@dbb.su.se"}]
maintainers = [{name = "Hao Jiang", email = "hao.jiang@dbb.su.se"}]
keywords = ["QM/MM", "TURBOMOLE", "NAMD", "computational chemistry"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Chemistry",
]

[project.scripts]
turbomole-namd = "turbomole_namd.adapter:cli"

[tool.setuptools.packages.find]
where = ["src"]
