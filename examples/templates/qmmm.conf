# Supply validated topology, force fields, nonbonded/boundary settings, and
# output controls in mm.conf. It must not contain run/minimize commands.
source mm.conf
set Input "./Input"
set qmTotalCharge "CHOOSE_CHARGE"
set qmMultiplicity "CHOOSE_MULTIPLICITY"
if {![string is integer -strict $qmTotalCharge] ||
    ![string is integer -strict $qmMultiplicity] || $qmMultiplicity < 1} {
    error "Set qmTotalCharge and qmMultiplicity to match the TURBOMOLE input."
}
qmForces on
qmSoftware custom
set command [auto_execok turbomole-namd]
if {[llength $command] != 1} {error "Install turbomole-namd and make it available on PATH."}
qmExecPath [lindex $command 0]
set env(QM_PDB_FILE) [file normalize [file join $Input ref-qm_mm]]
# Prepare control/basis/orbitals for this exact order before the first run.
set env(QM_COORD_ORDER) namd
qmParamPDB $env(QM_PDB_FILE)
qmColumn beta
qmBondColumn occ
qmCharge "1 $qmTotalCharge"
qmMult "1 $qmMultiplicity"
set env(QM_CHARGE_MODE) mulliken
qmChargeMode $env(QM_CHARGE_MODE)
qmElecEmbed on
qmCustomPCSelection on
qmCustomPCFile [file join $Input ref-point_charge]
qmSwitching off
qmPointChargeScheme none
qmBondScheme CS
qmPCStride 1
qmSimsPerNode 1
set turbo_dir [file join [pwd] turbo-exec]
file mkdir $turbo_dir
qmBaseDir $turbo_dir
fixedAtoms on
fixedAtomsForces on
fixedAtomsFile [file join $Input ref-active]
fixedAtomsCol B
qmOutStride 1
qmPositionOutStride 1
# One minimization step validates execution, not scientific convergence.
minimize 1
